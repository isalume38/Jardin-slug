function mid3(t,x,y,c,k){X.fillStyle=c;X.strokeStyle=c;X.lineWidth=5;if(t===10){X.beginPath();X.moveTo(x+30,y);X.quadraticCurveTo(x+50,y-90,x+36,y-150);X.stroke();for(let a=0;a<5;a++){X.beginPath();X.moveTo(x+36,y-150);X.quadraticCurveTo(x+36+(a-2)*22,y-190,x+36+(a-2)*40,y-130);X.stroke()}X.fillRect(x+100,y-60,60,60);X.beginPath();X.moveTo(x+90,y-60);X.lineTo(x+130,y-100);X.lineTo(x+170,y-60);X.fill()}else if(t===11){X.fillRect(x,y-120-k*80,60,120+k*80);X.fillRect(x+70,y-90,40,90);X.fillStyle=k<.5?'#ff3ad0':'#3aeaff';X.fillRect(x+4,y-110-k*80,4,100+k*80);X.fillRect(x+52,y-110-k*80,4,100+k*80);X.fillStyle='#ffffff33';for(let a=0;a<4;a++)X.fillRect(x+14,y-100-k*80+a*24,30,8)}else if(t===12){X.strokeStyle='#2a8a5a';X.lineWidth=6;for(let a=0;a<3;a++){X.beginPath();X.moveTo(x+a*18,y);for(let b=1;b<=6;b++)X.lineTo(x+a*18+Math.sin(b+time*.03+a)*10,y-b*24);X.stroke()}X.fillStyle='#d05a7a';X.beginPath();X.arc(x+100,y-20,22,Math.PI,0);X.fill()}else if(t===13){X.fillRect(x+40,y-90,20,90);X.fillStyle='#c050d0';X.beginPath();X.ellipse(x+50,y-96,56,34,0,Math.PI,0);X.fill();X.fillStyle='#ffffff55';[[-20,-110],[10,-120],[28,-104]].forEach(o=>{X.beginPath();X.arc(x+50+o[0],y+o[1]+10,5,0,7);X.fill()})}else{X.beginPath();X.moveTo(x,y);X.lineTo(x+20,y-170);X.lineTo(x+40,y-60);X.lineTo(x+60,y-190);X.lineTo(x+80,y);X.fill();X.fillStyle='#ff4a1a88';X.fillRect(x+30,y-50,20,50)}}
function near3(t,x,y,k){if(t===10){X.fillStyle='#d94a3a';X.beginPath();X.arc(x+14,y-8,8,0,7);X.fill();X.fillRect(x,y-8,28,3);X.fillStyle='#ffd23f';X.beginPath();X.moveTo(x+50,y);X.lineTo(x+56,y-34);X.lineTo(x+66,y);X.fill()}else if(t===11){X.fillStyle='#222';X.fillRect(x+10,y-70,6,70);X.fillStyle=k<.5?'#ff3ad0':'#3aeaff';X.fillRect(x,y-80,26,12)}else if(t===12){X.fillStyle='#ff7a9a';for(let a=0;a<3;a++){X.beginPath();X.arc(x+a*12,y-8-a%2*6,7,0,7);X.fill()}}else if(t===13){X.fillStyle='#e8d8b8';X.fillRect(x+8,y-18,6,18);X.fillStyle='#60e0d0';X.beginPath();X.ellipse(x+11,y-18,13,8,0,Math.PI,0);X.fill()}else{X.fillStyle='#d8d0c0';X.beginPath();X.moveTo(x,y);X.lineTo(x+8,y-40);X.lineTo(x+16,y);X.fill();X.beginPath();X.moveTo(x+20,y);X.lineTo(x+28,y-28);X.lineTo(x+36,y);X.fill()}}

function shop(){const y=U.scrollTop,K='<i class=co></i>';U.innerHTML=`<div class=top><button onclick=menu()>← Niveaux</button><span>${K} ${S.co} · XP ${Math.floor(S.xp)}</span></div><h2>Expérience</h2><div class=g3><div class=cd><b>XP : ${Math.floor(S.xp)}</b><small>4 XP = 1 pièce (rendement faible)</small><button onclick=conv()>Convertir en pièces</button></div></div><h2>Personnages</h2><div class=g3>${Object.keys(CH).map(k=>{const c=CH[k],o=S.chs[k];return `<div class="cd${S.ch===k?' on':''}"><b>${c.n}</b><small>${c.t}<br>PV ${c.hp}</small><button onclick="${o?`S.ch='${k}';save();shop()`:`buy('c','${k}')`}">${S.ch===k?'Choisi':o?'Choisir':K+' '+c.pr}</button></div>`}).join('')}</div><h2>Skins</h2><div class=g3><div class="cd${S.skin===''?' on':''}"><b>Normal</b><small>Couleur d’origine</small><button onclick="skin('')">${S.skin===''?'Actif':'Choisir'}</button></div>${SKINS.map((s,i)=>{const o=S.skins[i],c=typeof s[2]==='function'?'#ff3ad0':s[2];return `<div class="cd${S.skin===i?' on':''}"><b><i style='display:inline-block;width:1em;height:1em;border-radius:50%;background:${c};vertical-align:-.15em'></i> ${s[0]}</b><small>${s[3]?'Avec effet brillant':'Couleur'}</small><button onclick="skin(${i})">${S.skin===i?'Actif':o?'Choisir':K+' '+s[1]}</button></div>`}).join('')}</div><h2>Compagnons (un seul actif)</h2><div class=g3>${Object.keys(PT).map(k=>{const q=PT[k],o=S.pets[k];return `<div class="cd${S.pet===k?' on':''}"><b>${q[0]}</b><small>${q[2]}</small><button onclick="pet('${k}')">${S.pet===k?'Actif (retirer)':o?'Choisir':K+' '+q[1]}</button></div>`}).join('')}</div><h2>Améliorations (niveau 10 max)</h2><div class=g3>${Object.keys(UP).map(k=>{const u=UP[k],l=S.up[k]||0,pr=u[2]*(l+1);return `<div class=cd><b>${u[0]}</b><small>${u[3]} · niveau ${l}/10</small><button ${l>=10?'disabled':''} onclick="upg('${k}')">${l>=10?'Max':K+' '+pr}</button></div>`}).join('')}</div><h2>Équipements (tous actifs)</h2><div class=g3>${EQ.map((e,i)=>`<div class=cd><b>${e[0]}</b><small>$
