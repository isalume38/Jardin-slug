<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jardin Slug 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1b1330;--fg:#f4ecc8;--ac:#9be564;--hot:#ff7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Bangers,Impact,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;-webkit-user-select:none;user-select:none}
#w{position:relative;width:min(100vw,160vh)}canvas{width:100%;display:block;aspect-ratio:16/9;background:#000}
#ui{position:absolute;inset:0;overflow:auto;background:#150b2bf5;padding:2% 3%;box-sizing:border-box;font-size:clamp(12px,2.3vw,20px);letter-spacing:.5px;text-align:center}
h1{font-size:2.6em;margin:0;color:var(--ac)}h2{margin:.6em 0 .3em;color:#ffd23f}
button{font:inherit;color:#1b1330;background:var(--ac);border:0;padding:.3em .9em;border-radius:5px;cursor:pointer}button:focus-visible{outline:3px solid var(--hot)}button:disabled{background:#3a2f55;color:#7a6f95;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;margin:.4em 0}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lv{padding:.5em .2em;font-size:1.5em;display:flex;flex-direction:column;align-items:center;color:#fff;text-shadow:0 1px 3px #000}.lv small{font-size:.5em;color:#ffd23f}
.t0{background:#3f7a2c}.t1{background:#4a3a7a}.t2{background:#c9892f}.t3{background:#2f6a5a}.t4{background:#5a5a72}
.lv:disabled{background:#2a2142}.cd{background:#2a2142;border-radius:6px;padding:.5em;display:flex;flex-direction:column;gap:.3em}.cd.on{outline:2px solid var(--ac)}.cd small{opacity:.8}
.st{font-size:3em;color:#ffd23f}.co{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd23f 50%,#c9892f);border:2px solid #8a5a10;box-sizing:border-box;vertical-align:-.1em}
#bar{font-size:15px;opacity:.85;display:flex;gap:14px;align-items:center}
#pad{display:none;width:100%;justify-content:space-between;padding:0 14px 8px;box-sizing:border-box}#pad div{display:flex;gap:8px}
#pad b{width:58px;height:58px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:400}
@media (pointer:coarse){#pad{display:flex}#bar .k{display:none}}

function near3(t,x,y,k){if(t===10){X.fillStyle='#d94a3a';X.beginPath();X.arc(x+14,y-8,8,0,7);X.fill();X.fillRect(x,y-8,28,3);X.fillStyle='#ffd23f';X.beginPath();X.moveTo(x+50,y);X.lineTo(x+56,y-34);X.lineTo(x+66,y);X.fill()}else if(t===11){X.fillStyle='#222';X.fillRect(x+10,y-70,6,70);X.fillStyle=k<.5?'#ff3ad0':'#3aeaff';X.fillRect(x,y-80,26,12)}else if(t===12){X.fillStyle='#ff7a9a';for(let a=0;a<3;a++){X.beginPath();X.arc(x+a*12,y-8-a%2*6,7,0,7);X.fill()}}else if(t===13){X.fillStyle='#e8d8b8';X.fillRect(x+8,y-18,6,18);X.fillStyle='#60e0d0';X.beginPath();X.ellipse(x+11,y-18,13,8,0,Math.PI,0);X.fill()}else{X.fillStyle='#d8d0c0';X.beginPath();X.moveTo(x,y);X.lineTo(x+8,y-40);X.lineTo(x+16,y);X.fill();X.beginPath();X.moveTo(x+20,y);X.lineTo(x+28,y-28);X.lineTo(x+36,y);X.fill()}}
