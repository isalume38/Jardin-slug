function tone(f,t,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function nz(t,d,v,f){const s=AC.createBufferSource(),g=AC.createGain(),l=AC.createBiquadFilter();s.buffer=NB;l.type='lowpass';l.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(l);l.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d)}
function sfx(k){if(muted)return;if(k==='shb'||k==='sha')k='shc';if(X_A['s_'+k]){const a=X_A['s_'+k].cloneNode();a.volume=.6;a.play().catch(()=>{});return}if(!AC)return;const t=AC.currentTime;({shc:()=>tone(900,t,.06,'square',.04,500),shp:()=>tone(650,t,.05,'sine',.07,300),shf:()=>{tone(200,t,.12,'sawtooth',.05,90);nz(t,.08,.05,800)},gb:()=>tone(150,t,.18,'square',.07,60),j:()=>tone(380,t,.14,'square',.05,760),ng:()=>tone(300,t,.2,'triangle',.08,600),bm:()=>{nz(t,.6,.35,900);tone(90,t,.5,'sawtooth',.12,25)},h:()=>tone(160,t,.08,'sawtooth',.05,80),k:()=>nz(t,.15,.12,1500),c:()=>{tone(1200,t,.08,'square',.04);tone(1600,t+.07,.1,'square',.04)},o:()=>[0,3,7,12].forEach((s,i)=>tone(fq(72+s),t+i*.06,.12,'square',.05)),ow:()=>{tone(220,t,.35,'sawtooth',.1,60);nz(t,.2,.1,600)},ar:()=>tone(500,t,.15,'triangle',.04,900),ro:()=>{tone(70,t,1.2,'sawtooth',.15,35);nz(t,1,.2,500)},fz:()=>tone(1800,t,.08,'square',.02)})[k]?.()}
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;nxt=AC.currentTime+.1;setInterval(sched,40)}catch(e){}}
function sched(){while(nxt<AC.currentTime+.2){const t=nxt,s=step%32;if(!muted&&!X_A.music){if(mus){if(BL[s])tone(fq(BL[s]),t,.12,'sawtooth',.04);tone(fq(s<16?33:34),t,.1,'sawtooth',.08);if(step%8===0||step%8===2)tone(70,t,.14,'sine',.3,35);if(step%32===0)tone(110,t,2.6,'sawtooth',.03,440);if(step%64===0)tone(300,t,2.2,'sine',.05,620);if(step%48===0)nz(t,.9,.14,300)}else{const e=thm===2,l=LD[e?1:0][s];if(l)tone(fq(l+(e?0:[0,-2,0,-5,3][thm])),t,.15,'square',.035);if(s%4!==3)tone(fq(s<16?45:e?44:43),t,.15,'triangle',.09);if(step%8===0)tone(110,t,.12,'sine',.18,40);if(step%2)tone(7000,t,.03,'square',.012)}}nxt+=mus?.082:.107;step++}}

bs=[];zs=[];as=[];ns=[];ps=[];its=[];cam=0;wi=0;lock=null;spawnQ=0;spT=0;tr=100;bt=0;shake=0;kills=0;brutes=0;Lv={co:0,lost:0};tx=[];gb=[];slow=0;vn=[];LV.cp=[];LV.cr=[];for(let i=0;i<2+(n>>3);i++)LV.cp.push({x:600+i*((len-1400)/(2+(n>>3))|0)+(Math.random()*200|0),d:0,t:0});state='play';mus=0;thm=t;const BN={10:'Mega-Spore Mech',20:'Le Seigneur des Tombes',30:'La Reine du Marais',40:'Le Destructeur de Jardins',50:'Professeur Zom-Botanic'};TD.forEach(q=>{q.b0=q.b0||q.bo;q.bo=BN[n]||q.b0});U.style.display='none';say('Niveau '+n+' · '+TD[t].n);vo('Mission '+n+', c’est parti !')}
