<style>

<div id="w"><canvas id="c" width="800" height="450"></canvas><div id="ui"></div></div>

<script>
const E=id=>document.getElementById(id),C=E('c'),X=C.getContext('2d'),U=E('ui'),W=800,H=450,G=380;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=i=>{const s=Math.sin(i*127.1+311.7)*43758.5;return s-Math.floor(s)};
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)),mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>v+(B[i]-v)*t|0)+')'};
const D=()=>({cl:1,st:{},co:0,own:{},ch:'c',chs:{c:1}});let S=D();try{S=Object.assign(D(),JSON.parse(localStorage.getItem('jslug2')))}catch(e){}

const EQ=[['Bottes de sprint',80,'sp',.4,'Vitesse +'],['Pot blindé',120,'hp',3,'PV +3'],['Gants de jardinier',150,'rt',2,'Cadence +'],['Engrais costaud',200,'dm',.5,'Dégâts +'],['Sac de graines',100,'gn',3,'Bombes +3'],['Ressorts',110,'jm',1.5,'Saut plus haut'],['Feuilles planeuses',250,'dj',1,'Double saut'],['Épines acérées',300,'pc',1,'Tirs perforants'],['Seconde tige',400,'sd',1,'Un tir de plus'],['Rosée magique',180,'ob',600,'Orbes +10 s'],['Mousse protectrice',220,'iv',50,'Invincibilité +'],['Tirelire',160,'co',.25,'Pièces +25 %'],['Grosse bombe',190,'rd',30,'Explosion +'],['Racines vives',350,'rg',1,'Régénération'],['Sève vampire',450,'vp',1,'Soin en tuant'],['Casque de bambou',260,'hp',4,'PV +4'],['Bottes de vent',300,'sp',.5,'Vitesse ++'],['Super arrosoir',500,'rt',3,'Cadence ++'],['Fertilisant nucléaire',600,'dm',1,'Dégâts ++'],['Couronne royale',800,'co',.5,'Pièces +50 %']];

const TH=[0,0,0,0,1,1,1,3,3,3,2,3,3,1,1,4,4,4,4,2],MC=['#1d3a3c','#1a1630','#8a5a2a','#14302a','#2a2a3a'],ZC=['#8fae7a','#9aa88a','#e6d9ae','#7a9a5a','#a09a8a'],ZK=['#6b5a8a','#4a4a6a','#c9b27a','#5a7a4a','#7a5a4a'];

/* ---------- Audio ---------- */
let AC,NB,muted=false,step=0,nxt=0,mus=0,thm=0;
const LD=[[69,0,72,0,76,0,72,0,69,0,72,76,81,0,79,76,67,0,71,0,74,0,71,0,67,0,71,74,79,0,76,74],[69,0,70,0,76,0,75,76,77,0,76,0,73,0,72,69,69,0,70,72,76,0,77,76,75,0,73,0,72,70,69,0]],BL=[57,0,0,0,58,0,0,0,57,0,0,0,63,0,62,0,57,0,0,0,58,0,0,0,60,0,59,0,63,0,62,58],fq=m=>440*2**((m-69)/12);
function tone(f,t,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function nz(t,d,v,f){const s=AC.createBufferSource(),g=AC.createGain(),l=AC.createBiquadFilter();s.buffer=NB;l.type='lowpass';l.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(l);l.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d)}
function sfx(k){if(!AC||muted)return;const t=AC.currentTime;({shc:()=>tone(900,t,.06,'square',.04,500),shp:()=>tone(650,t,.05,'sine',.07,300),shf:()=>{tone(200,t,.12,'sawtooth',.05,90);nz(t,.08,.05,800)},gb:()=>tone(150,t,.18,'square',.07,60),j:()=>tone(380,t,.14,'square',.05,760),ng:()=>tone(300,t,.2,'triangle',.08,600),bm:()=>{nz(t,.6,.35,900);tone(90,t,.5,'sawtooth',.12,25)},h:()=>tone(160,t,.08,'sawtooth',.05,80),k:()=>nz(t,.15,.12,1500),c:()=>{tone(1200,t,.08,'square',.04);tone(1600,t+.07,.1,'square',.04)},o:()=>[0,3,7,12].forEach((s,i)=>tone(fq(72+s),t+i*.06,.12,'square',.05)),ow:()=>{tone(220,t,.35,'sawtooth',.1,60);nz(t,.2,.1,600)},ar:()=>tone(500,t,.15,'triangle',.04,900),ro:()=>{tone(70,t,1.2,'sawtooth',.15,35);nz(t,1,.2,500)},fz:()=>tone(1800,t,.08,'square',.02)})[k]?.()}
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;nxt=AC.currentTime+.1;setInterval(sched,40)}catch(e){}}
function sched(){while(nxt<AC.currentTime+.2){const t=nxt,s=step%32;if(!muted){if(mus){if(BL[s])tone(fq(BL[s]),t,.12,'sawtooth',.04);tone(fq(s<16?33:34),t,.1,'sawtooth',.08);if(step%8===0||step%8===2)tone(70,t,.14,'sine',.3,35);if(step%32===0)tone(110,t,2.6,'sawtooth',.03,440);if(step%64===0)tone(300,t,2.2,'sine',.05,620);if(step%48===0)nz(t,.9,.14,300)}else{const e=thm===2,l=LD[e?1:0][s];if(l)tone(fq(l+(e?0:[0,-2,0,-5,3][thm])),t,.15,'square',.035);if(s%4!==3)tone(fq(s<16?45:e?44:43),t,.15,'triangle',.09);if(step%8===0)tone(110,t,.12,'sine',.18,40);if(step%2)tone(7000,t,.03,'square',.012)}}nxt+=mus?.082:.107;step++}}
const mute=()=>{muted=!muted;E('mu').textContent='Son : '+(muted?'non':'oui')};E('mu').onclick=mute;
/* ---------- Entrées ---------- */
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(/Space|Arrow/.test(e.code))e.preventDefault();audio();if(e.code==='KeyM')mute()});addEventListener('keyup',e=>keys[e.code]=0);addEventListener('pointerdown',audio);
document.querySelectorAll('#pad b').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=0))});
const L_=()=>keys.ArrowLeft||keys.KeyA||keys.KeyQ,R_=()=>keys.ArrowRight||keys.KeyD,J_=()=>keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ,F_=()=>keys.KeyX||keys.KeyJ,B_=()=>keys.KeyC||keys.KeyK,DN=()=>keys.ArrowDown||keys.KeyS;
/* ---------- Menus ---------- */
function menu(){state='menu';mus=0;U.style.display='block';U.innerHTML=`<h1>JARDIN SLUG 2</h1><div class=top><span>🪙 ${S.co} · ${CH[S.ch].n}</span><button onclick=shop()>Boutique</button></div><div class=g>${TH.map((t,i)=>{const n=i+1,ok=n<=S.cl,s=S.st[n]||0;return `<button class="lv t${t}" ${ok?'':'disabled'} onclick=play(${n})>${ok?n:'🔒'}<small>${ok?TD[t].n:'—'}</small><small>${ok?'★'.repeat(s)+'☆'.repeat(3-s):''}</small></button>`}).join('')}</div>`}
function shop(){const y=U.scrollTop;U.innerHTML=`<div class=top><button onclick=menu()>← Niveaux</button><span>🪙 ${S.co}</span></div><h2>Personnages</h2><div class=g3>${Object.keys(CH).map(k=>{const c=CH[k],o=S.chs[k];return `<div class="cd${S.ch===k?' on':''}"><b>${c.n}</b><small>${c.t}<br>PV ${c.hp}</small><button onclick="${o?`S.ch='${k}';save();shop()`:`buy('c','${k}')`}">${S.ch===k?'Choisi':o?'Choisir':'🪙 '+c.pr}</button></div>`}).join('')}</div><h2>Équipements (tous actifs)</h2><div class=g3>${EQ.map((e,i)=>`<div class=cd><b>${e[0]}</b><small>${e[4]}</small><button ${S.own[i]?'disabled':''} onclick="buy('e',${i})">${S.own[i]?'Acheté':'🪙 '+e[1]}</button></div>`).join('')}</div>`;U.scrollTop=y}
function buy(t,k){const pr=t==='c'?CH[k].pr:EQ[k][1];if(S.co<pr)return;S.co-=pr;if(t==='c'){S.chs[k]=1;S.ch=k}else S.own[k]=1;save();sfx('c');shop()}
function result(w,s,g){U.style.display='block';U.innerHTML=w?`<h1>NIVEAU ${LV.n} RÉUSSI !</h1><div class=st>${'★'.repeat(s)+'☆'.repeat(3-s)}</div><p>+${g} pièces 🪙</p>${LV.n<20?`<button onclick=play(${LV.n+1})>Niveau suivant</button> `:'<h2>Le jardin est sauvé !</h2>'}<button onclick=play(${LV.n})>Rejouer</button> <button onclick=menu()>Menu</button>`:`<h1 style="color:#ff5a3d">FANÉ !</h1><p>Tu as perdu tes trois vies.</p><button onclick=play(${LV.n})>Réessayer</button> <button onclick=menu()>Menu</button>`}
/* ---------- Jeu ---------- */
let LV,p,st,bs,zs,as,ns,ps,its,cam,wi,lock,spawnQ,spT,tr,bt,shake,kills,brutes,Lv,time=0,msg='',msgT=0,state='menu',tx=[],gb=[],slow=0,spawnN=1;
const say=m=>{msg=m;msgT=130};
const TY={walk:{hp:2,sp:.9,s:1,d:2,c:1},run:{hp:1,sp:2.2,s:.95,d:2,c:2},kami:{hp:1,sp:2.9,s:.85,d:3,c:2},arch:{hp:2,sp:.7,s:1,d:1,c:3},brute:{hp:14,sp:.45,s:1.6,d:3,c:10},boss:{hp:90,sp:.7,s:2.8,d:3,c:100}};
function play(n){const t=TH[n-1],len=3000+n*200,nw=2+Math.ceil(n/5),ws=[];for(let i=0;i<nw;i++)ws.push({x:700+i*((len-1700)/nw|0),n:Math.round(5+n*.5+i*1.5),b:n>=5&&i>0?1+(n>>3):0});ws.push({x:len-600,n:3+(n>>2),b:0,boss:1});
const pl=[];for(let x=450;x<len-300;x+=260+(Math.random()*220|0)){const y=G-[80,80,150][Math.random()*3|0],w=100+(Math.random()*80|0);pl.push({x,y,w});if(y<G-100)pl.push({x:x-100,y:G-80,w:90})}
LV={n,t,len,ws,pl};st={sp:0,hp:0,rt:0,dm:0,gn:0,jm:0,dj:0,pc:0,sd:0,ob:0,iv:0,co:0,rd:0,rg:0,vp:0};EQ.forEach((e,i)=>{if(S.own[i])st[e[2]]+=e[3]});
const c=CH[S.ch];p={w:0,slug:0,rc:0,x:120,y:G,vy:0,f:1,mx:c.hp+st.hp,hp:c.hp+st.hp,lives:3,inv:0,cd:0,g:6+st.gn,run:0,j:0,dr:0,gr:1,o:{T:0,G:0,R:0,S:0,F:0}};
bs=[];zs=[];as=[];ns=[];ps=[];its=[];cam=0;wi=0;lock=null;spawnQ=0;spT=0;tr=100;bt=0;shake=0;kills=0;brutes=0;Lv={co:0,lost:0};tx=[];gb=[];slow=0;LV.cp=[];for(let i=0;i<2+(n>>3);i++)LV.cp.push({x:600+i*((len-1400)/(2+(n>>3))|0)+(Math.random()*200|0),d:0,t:0});state='play';mus=0;thm=t;U.style.display='none';say('Niveau '+n+' · '+TD[t].n)}
function burst(x,y,n,c,sp=4){for(let i=0;i<n;i++)ps.push({x,y,vx:(Math.random()-.5)*sp*2,vy:-Math.random()*sp,l:30+Math.random()*20,c})}
function addE(ty,x,onpl){const T=TY[ty],n=LV.n,t=LV.t,hp=Math.ceil(T.hp*(ty==='boss'?1+n*.22:ty==='brute'?1+n*.05:1+n*.07));
const z={x,y:G,type:ty,hp,mx:hp,sp:T.sp*(.85+Math.random()*.3),s:T.s,d:T.d,cn:T.c,t:Math.random()*6,f:-1,fl:0,cd:60+(Math.random()*60|0),c:ty==='arch'?'#e8e4d0':ty==='kami'?'#5fb04a':ZC[t],k:ty==='kami'?'#3a6a2a':ty==='run'?'#b8452f':ty==='arch'?'#4a4458':ZK[t]};
if(ty==='arch'&&onpl){const q=LV.pl.filter(q=>q.x>cam+60&&q.x<cam+W-60);if(q.length&&Math.random()<.6){const a=q[Math.random()*q.length|0];z.x=a.x+a.w/2;z.y=a.y;z.pl=1}}zs.push(z)}
const pick=()=>{const n=LV.n,a=['walk','walk'];if(n>=2)a.push('run');if(n>=3)a.push('kami');if(n>=4)a.push('arch');return a[Math.random()*a.length|0]};
function boom(x,y,r){shake=12;sfx('bm');burst(x,y,26,'#ff9a3d',6);burst(x,y,14,'#9be564',5)}
function gibs(z){for(let i=0;i<5;i++)gb.push({x:z.x,y:z.y-30*z.s,vx:(Math.random()-.5)*8+(z.x>p.x?2:-2),vy:-Math.random()*8-3,r:0,vr:(Math.random()-.5)*.6,s:(5+Math.random()*7)*z.s,c:i%2?z.c:z.k,l:70})}
const WP={H:{n:'MITRAILLEUSE',a:140,cd:3,d:1,r:3,pc:0,v:13,l:70,c:'#fff27a'},L:{n:'LASER',a:70,cd:6,d:1.6,r:3,pc:9,v:20,l:60,c:'#ff4aff'},F:{n:'LANCE-FLAMMES',a:90,cd:3,d:1.2,r:6,pc:3,v:6,l:22,c:'#ff7a2a'},R:{n:'LANCE-ROQUETTES',a:16,cd:16,d:4,r:6,pc:0,v:9,l:80,c:'#cccccc',x:1}};
const role=()=>{const f=1-spawnQ/spawnN,n=LV.n,a=f<.35?['run','walk','kami']:f<.7?['arch','walk','kami']:['walk','run','arch'],t=a[Math.random()*3|0];return (t!=='run'||n>=2)&&(t!=='kami'||n>=3)&&(t!=='arch'||n>=4)?t:'walk'};
